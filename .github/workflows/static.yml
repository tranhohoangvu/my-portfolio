# Build the site, refresh GitHub stats and deploy to GitHub Pages.
# Stats are generated at deploy time (not committed), so the repo history
# stays clean and the live site always gets the freshly generated files.
name: Build & Deploy to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC — refreshes GitHub stats
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress production deploy finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Switch to `npm ci` once package-lock.json includes esbuild
        run: npm install --no-audit --no-fund

      - name: Build CSS & JS
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate GitHub stats (SVGs + JSON)
        # If the GitHub API hiccups, deploy anyway with the committed fallback SVGs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_github_contrib_svgs.py tranhohoangvu assets/github

      - name: Remove build-only files from the artifact
        run: rm -rf node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
